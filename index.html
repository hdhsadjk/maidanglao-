<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活動優惠入口</title>
<style>
:root{--red:#d90000;--yellow:#ffcc00;--ink:#242424}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;background:linear-gradient(180deg,#fff7c2 0,#fff 70%);color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 40px;text-align:center}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 35px rgba(70,30,0,.12);border:1px solid rgba(217,0,0,.10)}
.logo{width:92px;height:92px;object-fit:cover;border-radius:16px;display:block;margin:0 auto 14px}
h1{font-size:clamp(25px,4vw,40px);margin:0 0 8px;color:var(--red);font-weight:900}
p{line-height:1.7;color:#555;margin:0 0 20px}
.banner-link{display:block;line-height:0;border-radius:14px;overflow:hidden;outline-offset:5px}
.banner{width:100%;height:auto;display:block}
.cta{display:inline-block;margin-top:20px;background:var(--red);color:white;text-decoration:none;padding:15px 28px;border-radius:999px;font-weight:800;box-shadow:0 6px 0 #a90000}
.cta:hover{transform:translateY(-1px)}
.note{font-size:12px;color:#777;margin-top:18px}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<a href="https://lin.ee/Vsa4HUs" aria-label="前往官方客服／活動入口"><img class="logo" src="logo.png" alt="品牌標誌"></a>
<h1>活動優惠入口</h1>
<p>點擊活動圖片或下方按鈕，前往客服／領取入口。</p>
<a class="banner-link" href="https://lin.ee/Vsa4HUs" aria-label="前往活動優惠入口"><img class="banner" src="promotion_banner.png" alt="活動補償優惠活動圖片"></a>
<a class="cta" href="https://lin.ee/Vsa4HUs">立即前往官方入口 ↗</a>
<div class="note">如無法自動跳轉，請點擊上方按鈕重新開啟。</div>
</section></main>
</body></html>
